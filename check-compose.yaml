# Local (stage-1) checks — one service per check, mirroring the checks-*.yml
# GitHub workflows (same commands, purpose-built tool images). Run one:
#   podman-compose -f check-compose.yaml run --rm <service>
# or all, one after another:
#   for svc in shell python yaml yaml-syntax js css html md; do
#     podman-compose -f check-compose.yaml run --rm "$svc" || exit 1
#   done
# The GitHub workflows remain the authoritative gate (stage 2 — attested,
# per-commit results). The css/html/md checks run HERE only (dropped from
# GitHub as redundant with the strict mkdocs build, which still runs in the
# dev container + ci.yml).

services:
  shell:
    image: docker.io/koalaman/shellcheck-alpine:latest
    volumes:
      - .:/repo:ro
    command: ["shellcheck", "-S", "warning", "/repo/scripts/bootstrap-aws.sh", "/repo/scripts/invalidate-cloudfront.sh", "/repo/scripts/toggle-cloudfront.sh"]

  python:
    image: ghcr.io/astral-sh/ruff:latest
    volumes:
      - .:/repo:ro
    command: ["check", "/repo/terraform/lambda", "/repo/scripts"]

  yaml:
    image: ghcr.io/rhysd/actionlint:latest
    working_dir: /repo
    volumes:
      - .:/repo:ro
    command: ["-no-color"]

  yaml-syntax:
    image: docker.io/library/ruby:alpine
    working_dir: /repo
    volumes:
      - .:/repo:ro
    command: ["sh", "-c", "find .github -type f \\( -name '*.yml' -o -name '*.yaml' \\) -print | while IFS= read -r f; do ruby -ryaml -e 'YAML.load_file(ARGV[0])' \"$f\" || exit 1; done; ruby -ryaml -e 'YAML.load_file(ARGV[0])' mkdocs.yml; ruby -ryaml -e 'YAML.load_file(ARGV[0])' compose.yaml; ruby -ryaml -e 'YAML.load_file(ARGV[0])' check-compose.yaml"]

  js:
    image: docker.io/library/node:alpine
    working_dir: /repo
    volumes:
      - .:/repo:ro
    command: ["sh", "-c", "find docs/javascripts overrides -type f -name '*.js' -print | while IFS= read -r f; do node --check \"$f\" || exit 1; done"]

  css:
    image: docker.io/library/python:3.12-alpine
    volumes:
      - .:/repo:ro
    command: ["python3", "/repo/scripts/check_css.py"]

  html:
    image: docker.io/library/python:3.12-alpine
    volumes:
      - .:/repo:ro
    command: ["python3", "/repo/scripts/check_html.py"]

  md:
    image: docker.io/library/ruby:alpine
    volumes:
      - .:/repo:ro
    command: ["ruby", "/repo/scripts/check_md.rb"]
