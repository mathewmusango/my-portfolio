site_name: Mathew Musango Peter
site_description: Platform Engineering Manager | Kubernetes · Cloud · DevSecOps · Observability
# Canonical URL — the prod/gh-pages default. CI overrides it per environment
# at build time (site_url input: tags -> prod, main -> staging) so the baked
# canonical/OG/sitemap URLs match where the artifact will be served.
site_url: https://mathewmusango.github.io/my-portfolio/
copyright: Copyright &copy; 2026 Mathew Musango Peter

# Git repository link (header GitHub button)
repo_url: https://github.com/mathewmusango/my-portfolio
repo_name: mathewmusango/my-portfolio

nav:
  - Home:
      - Home: index.md
      - About: about.md
      - Professional Experience: experience.md
      - Technical Expertise: skills.md
      - Projects:
          - Projects: projects/index.md
          - Cloud & Migrations: projects/cloud-migrations.md
          - Observability & Monitoring: projects/observability.md
          - Security & Resilience: projects/security-resilience.md
          - Platform Engineering: projects/platform-engineering.md
          - Knowledge & Collaboration: projects/knowledge-collaboration.md
      - Certifications: certifications.md
      - Resume: resume.md
      - Contact: contact.md
  - Site Metrics:
      - Site Metrics: metrics/index.md
      - Visitor Analytics: metrics/analytics.md
  - Site Atlas:
      - Site Atlas: atlas/index.md
      - Release Timeline: atlas/releases.md
      - Tags: atlas/tags.md
      - Site Structure: atlas/structure.md

theme:
  name: material
  language: en
  custom_dir: overrides
  favicon: assets/img/favicon.ico
  logo: assets/img/logo.jpg
  icon:
    repo: fontawesome/brands/git-alt
    alternate: material/earth
    tag:
      aws: fontawesome/brands/aws
      migration: material/cloud-arrow-up
      cloud: material/cloud
      security: material/shield-lock
      vpn: material/network
      dr: material/backup-restore
      observability: material/chart-line
      monitoring: material/monitor
      metrics: material/counter
      logging: material/console-line
      tracing: material/vector-line
      devsecops: material/security
      pci-dss: material/credit-card-lock
      hardening: material/shield-lock-outline
      compliance: material/clipboard-check
      platform-engineering: material/view-dashboard
      kubernetes: material/kubernetes
      ci-cd: material/source-pull
      gitops: material/git
      collaboration: material/account-group
      knowledge: material/book-open-page-variant
      adoption: material/account-heart
      certifications: material/certificate-outline
      linux: fontawesome/brands/linux
      google: fontawesome/brands/google
      automation: material/lightning-bolt
      terraform: simple/terraform
      github-actions: simple/githubactions
      mkdocs: material/book-open-page-variant
      iac: material/code-tags
  font:
    text: Inter
    code: Roboto Mono
  features:
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  palette:
    # Dark (slate, teal) is the default look
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

# Do not build the snippet fragment as a page (it is inlined via --8<--)
exclude_docs: |
  includes/*

# Build hook — keeps the Site Metrics page counts computed at build time
# (scripts/site_metrics_hook.py replaces {{pages_*}}/{{pct_*}} tokens).
hooks:
  - scripts/site_metrics_hook.py

# Custom error pages are built but intentionally not in the nav
not_in_nav: |
  500.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: mathewmusango
      repo: my-portfolio
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: docs
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tabbed
  - toc:
      permalink: true
      toc_depth: "2-4"

plugins:
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
        - locale: es
          name: Español
          nav_translations:
            Home: Inicio
            About: Sobre mí
            Professional Experience: Experiencia Profesional
            Technical Expertise: Competencias Técnicas
            Projects: Proyectos
            Certifications: Certificaciones
            Resume: Currículum
            Contact: Contacto
            Site Metrics: Métricas del sitio
            Visitor Analytics: Análisis de visitas
            Site Atlas: Atlas del sitio
            Site Structure: Estructura del Sitio
            Release Timeline: Cronología de Versiones
            Tags: Etiquetas
            Cloud & Migrations: Nube y Migraciones
            Observability & Monitoring: Observabilidad y Monitoreo
            Security & Resilience: Seguridad y Resiliencia
            Platform Engineering: Ingeniería de Plataformas
            Knowledge & Collaboration: Conocimiento y Colaboración
        - locale: zh
          name: 中文
          nav_translations:
            Home: 首页
            About: 关于我
            Professional Experience: 专业经验
            Technical Expertise: 技术专长
            Projects: 项目
            Certifications: 认证
            Resume: 简历
            Contact: 联系我
            Site Metrics: 站点指标
            Visitor Analytics: 访客分析
            Site Atlas: 站点图谱
            Site Structure: 站点结构
            Release Timeline: 版本时间线
            Tags: 标签
            Cloud & Migrations: 云与迁移
            Observability & Monitoring: 可观测性与监控
            Security & Resilience: 安全与弹性
            Platform Engineering: 平台工程
            Knowledge & Collaboration: 知识与协作
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
      lang:
        - en
        - es
        - zh
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      # Snippet fragments (inlined via pymdownx.snippets) are not pages and
      # have no meaningful revision date — exclude to keep the strict build quiet.
      exclude:
        - includes/*
  - git-committers:
      repository: mathewmusango/my-portfolio
      branch: main
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      # Files to minify (pdf.min.js is already minified upstream — skip it)
      js_files:
        - javascripts/resume-modal.js
        - javascripts/cert-modal.js
        - javascripts/hero-lightbox.js
        - javascripts/pdf-viewer.js
        - javascripts/geo-map.js
        - javascripts/tags-grid.js
        - javascripts/footer-visits.js
      css_files:
        - stylesheets/extra.css
  # Download external assets (Google Fonts) at build time and serve them locally,
  # so visitors' browsers make no third-party requests.
  - privacy


extra_javascript:
  - javascripts/resume-modal.js
  - javascripts/cert-modal.js
  - javascripts/hero-lightbox.js
  - assets/js/pdf.min.js
  - javascripts/pdf-viewer.js
  - assets/js/tablesort.min.js
  - assets/js/tablesort.dotsep.min.js
  - javascripts/tablesort.js
  - assets/javascripts/mermaid.min.js
  - javascripts/diagram-zoom.js
  - javascripts/metrics-beacon.js
  - javascripts/geo-map.js
  - javascripts/tags-grid.js
  - javascripts/footer-visits.js
  - javascripts/metrics-live.js

extra:
  # Site Metrics beacon endpoint — set via METRICS_ENDPOINT at build/serve time.
  # Empty = beacon disabled (prod until the real stack deploys).
  metrics_endpoint: !ENV [METRICS_ENDPOINT, ""]
  # Hide the "Made with Material for MkDocs" footer badge.
  generator: false
  # Tag identifiers → icons (see theme.icon.tag).
  tags:
    AWS: aws
    Migration: migration
    Cloud: cloud
    Security: security
    VPN: vpn
    DR: dr
    Observability: observability
    Monitoring: monitoring
    Metrics: metrics
    Logging: logging
    Tracing: tracing
    DevSecOps: devsecops
    PCI-DSS: pci-dss
    Hardening: hardening
    Compliance: compliance
    Platform Engineering: platform-engineering
    Kubernetes: kubernetes
    CI/CD: ci-cd
    GitOps: gitops
    Collaboration: collaboration
    Knowledge: knowledge
    Adoption: adoption
    Certifications: certifications
    Linux: linux
    Google: google
    Automation: automation
    Terraform: terraform
    GitHub Actions: github-actions
    MkDocs: mkdocs
    IaC: iac
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mathew-musango/
    - icon: fontawesome/solid/envelope
      link: mailto:musangomathew@gmail.com
