site_name: Mathew Musango Peter
site_description: Platform Engineering and Infrastructure Leader | Kubernetes · Cloud · DevSecOps · Observability
copyright: Copyright &copy; 2026 Mathew Musango Peter

# Git repository link (header GitHub button)
repo_url: https://github.com/mathewmusango/my-portfolio
repo_name: mathewmusango/my-portfolio

nav:
  - Home: index.md
  - About: about.md
  - Professional Experience: experience.md
  - Technical Expertise: skills.md
  - Projects: projects.md
  - Certifications: certifications.md
  - Resume: resume.md
  - Contact: contact.md

theme:
  name: material
  language: en
  custom_dir: overrides
  favicon: assets/img/favicon.ico
  logo: assets/img/logo.jpg
  icon:
    repo: fontawesome/brands/git-alt
  font:
    text: Inter
    code: Roboto Mono
  features:
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

  palette:
    # Dark (slate, teal) is the default look
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

# Do not build the snippet fragment as a page (it is inlined via --8<--)
exclude_docs: |
  includes/*

# Custom error pages are built but intentionally not in the nav
not_in_nav: |
  500.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: mathewmusango
      repo: my-portfolio
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.tabbed
  - toc:
      permalink: true
      toc_depth: "2-4"

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - git-revision-date-localized:
      enable_creation_date: true
  - git-committers:
      repository: mathewmusango/my-portfolio
      branch: main
  - minify:
      minify_html: true


extra_javascript:
  - javascripts/resume-modal.js
  - javascripts/cert-modal.js
  - javascripts/hero-lightbox.js
  - assets/js/pdf.min.js
  - javascripts/pdf-viewer.js

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mathew-musango/
    - icon: fontawesome/solid/envelope
      link: mailto:musangomathew@gmail.com
