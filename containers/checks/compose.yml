name: checks
services:
  shell:
    image: docker.io/koalaman/shellcheck-alpine:latest
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command:
      - sh
      - -c
      - |
        find . -path './site' -prune -o -path './.git' -prune -o -type f \( -name '*.sh' -o -path './.githooks/*' \) -print0 2>/dev/null | xargs -0 -r shellcheck -S warning

  python:
    image: ghcr.io/astral-sh/ruff:latest
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command: ["check", ".", "--no-cache"]

  yaml:
    image: docker.io/rhysd/actionlint:latest
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command: ["-no-color"]

  yaml-syntax:
    image: docker.io/library/ruby:alpine
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command:
      - sh
      - -c
      - |
        find . -path './site' -prune -o -path './.git' -prune -o -type f \( -name '*.yml' -o -name '*.yaml' \) -print 2>/dev/null | while IFS= read -r f; do
          ruby -ryaml -e "YAML.load_file(ARGV[0])" "$$f" || { echo "FAILED: $$f"; exit 1; }
          echo "ok: $$f"
        done

  js:
    image: docker.io/library/node:alpine
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command:
      - sh
      - -c
      - |
        find . -path './site' -prune -o -path './.git' -prune -o -path './node_modules' -prune -o -type f -name '*.js' -print0 2>/dev/null | while IFS= read -r -d '' f; do
          node --check "$$f" || { echo "FAILED: $$f"; exit 1; }
        done
        echo 'js: all files syntax-checked'

  pip-audit:
    image: docker.io/library/python:3.12-slim
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command:
      - sh
      - -c
      - |
        pip install --disable-pip-version-check -q pip-audit==2.10.1
        pip-audit -r requirements.txt

  npm-audit:
    image: docker.io/library/node:22-slim
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command: ["npm", "audit", "--package-lock-only", "--audit-level=high"]

  terraform-fmt:
    image: docker.io/hashicorp/terraform:1.15.9
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command: ["fmt", "-check", "-recursive", "-diff", "terraform/"]

  terraform-validate:
    image: docker.io/hashicorp/terraform:1.15.9
    entrypoint: ["/bin/sh", "-c"]
    working_dir: /repo
    environment:
      TF_PLUGIN_CACHE_DIR: /plugin-cache
    volumes:
      - ../..:/repo:ro
      - tf-plugins:/plugin-cache
    command: ["TF_DATA_DIR=/tmp/tf-root terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly && TF_DATA_DIR=/tmp/tf-root terraform -chdir=terraform validate -no-color && TF_DATA_DIR=/tmp/tf-ci terraform -chdir=terraform/bootstrap init -backend=false -input=false -lockfile=readonly && TF_DATA_DIR=/tmp/tf-ci terraform -chdir=terraform/bootstrap validate -no-color"]

  terraform-lint:
    image: ghcr.io/terraform-linters/tflint:latest
    entrypoint: ["/bin/sh", "-c"]
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
      - tflint-plugins:/root/.tflint.d
    command: ["tflint --init && cd terraform && tflint --recursive --format compact --config /repo/.tflint.hcl && cd bootstrap && tflint --format compact --config /repo/.tflint.hcl"]

  terraform-security:
    image: ghcr.io/bridgecrewio/checkov:3.3.15
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command: ["-d", "terraform", "--framework", "terraform", "--quiet", "--soft-fail"]

  # Whole repository, two modes. In a plain clone `.git` is a directory, so this scans
  # every commit (`git --log-opts=--all`) and .gitignore is honoured implicitly: an
  # ignored file was never committed, so it cannot appear in history. This checkout's
  # `.git` is a *file* pointing at the umbrella's gitdir, which the mount does not
  # include, so history is unreachable — it scans the whole working tree instead, and
  # gitleaks.toml covers the two gitignored artifact classes.
  #
  # WHY THE CONFIG, NOT .gitignore: `gitleaks dir` has no ignore-file support. The CLI
  # exposes only `--baseline-path`, `--gitleaks-ignore-path` (fingerprints) and config
  # allowlists, so .gitignore cannot be handed to it — hence gitleaks.toml, whose two
  # path patterns mirror .gitignore lines 45 and 51.
  #
  # WHY THE ENTRYPOINT OVERRIDE: the image's ENTRYPOINT is `gitleaks`, so a plain
  # `command: [sh, -c, ...]` is parsed as gitleaks subcommands and dies with
  # `unknown command "sh"`. The image does ship /bin/sh.
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:latest
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
      - ./gitleaks.toml:/etc/gitleaks/gitleaks.toml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -d .git ]; then
          echo "gitleaks: scanning all commits"
          exec gitleaks git . --log-opts=--all --config /etc/gitleaks/gitleaks.toml --no-banner -v --redact
        else
          echo "gitleaks: .git is a file (umbrella gitdir) — scanning the whole working tree"
          exec gitleaks dir . --config /etc/gitleaks/gitleaks.toml --no-banner -v --redact
        fi

volumes:
  tf-plugins:
  tflint-plugins:
