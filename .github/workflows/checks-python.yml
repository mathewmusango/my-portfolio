name: Checks Python

# Ruff lint on the Lambda + hook python — runs once on main (or dispatch)
# when terraform/lambda/** or scripts/*.py changes. (Not triggered by this
# file's own change — workflow files are linted by checks-yml.)
on:
  push:
    branches: [main]
    paths:
      - "terraform/lambda/**"
      - "scripts/*.py"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v1
        with:
          src: "terraform/lambda scripts"
