name: Checks Python

# Ruff lint on every python file in the repo — runs once on main (or dispatch)
# when any .py changes, anywhere. Extension-wide so NEW python files in new
# locations are never missed.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # ruff . respects .gitignore (site/, .terraform/, … are skipped).
      - uses: astral-sh/ruff-action@v1
        with:
          src: "."
