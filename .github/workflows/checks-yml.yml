name: Checks YAML

# actionlint on the GitHub Actions workflows — catches expression/context
# errors the parser won't. Runs once on main (or dispatch) when any workflow
# file changes.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v1
