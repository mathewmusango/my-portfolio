name: Checks YAML

# actionlint on the GitHub Actions workflows + a YAML syntax parse of every
# yml/yaml in the repo (.github/**, mkdocs.yml, compose.yaml). Runs once on
# main (or dispatch) when any of those change.
on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "mkdocs.yml"
      - "compose.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  yaml:
    name: yaml syntax (all .github yml/yaml + mkdocs.yml + compose.yaml)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Parse YAML (Ruby's built-in psych — no installs)
        run: |
          find .github -type f \( -name '*.yml' -o -name '*.yaml' \) -print 2>/dev/null | while IFS= read -r f; do
            ruby -ryaml -e "YAML.load_file(ARGV[0])" "$f"
            echo "ok: $f"
          done
          ruby -ryaml -e "YAML.load_file(ARGV[0])" mkdocs.yml
          ruby -ryaml -e "YAML.load_file(ARGV[0])" compose.yaml

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # v2 required: v1 is a composite wrapping github-script@v7 internally,
      # which crashes on Node-24 runners (ERR_PACKAGE_PATH_NOT_EXPORTED).
      - uses: raven-actions/actionlint@v2
