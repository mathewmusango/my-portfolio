name: Checks YAML

# actionlint on the GitHub Actions workflows — catches expression/context
# errors the parser won't. Runs once on main (or dispatch) when any workflow
# file changes.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # v2 required: v1 is a composite wrapping github-script@v7 internally,
      # which crashes on Node-24 runners (ERR_PACKAGE_PATH_NOT_EXPORTED).
      - uses: raven-actions/actionlint@v2
