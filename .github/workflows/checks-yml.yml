name: Checks YAML

# actionlint on the GitHub Actions workflows + a YAML syntax parse of the
# repo's other YAML files (mkdocs.yml, compose.yaml, composite action
# metadata). Runs once on main (or dispatch) when any of those change —
# not on this file's own change (workflow files are linted here anyway).
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "mkdocs.yml"
      - "compose.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  yaml:
    name: yaml syntax (mkdocs.yml / compose.yaml / action.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Parse YAML (Ruby's built-in psych — no installs)
        run: |
          for f in mkdocs.yml compose.yaml .github/actions/*/action.yml; do
            [ -f "$f" ] || continue
            ruby -ryaml -e "YAML.load_file(ARGV[0])" "$f"
            echo "ok: $f"
          done

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # v2 required: v1 is a composite wrapping github-script@v7 internally,
      # which crashes on Node-24 runners (ERR_PACKAGE_PATH_NOT_EXPORTED).
      - uses: raven-actions/actionlint@v2
