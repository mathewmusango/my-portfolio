name: "Deploy: Infra"

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Plan or apply (apply is destructive — review the plan first)"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      environment:
        description: "Target (default: v* tag -> prod, main -> staging)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - staging
          - prod
      stack:
        description: "Which root(s) to run"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - site
          - metrics

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environments: ${{ steps.classify.outputs.environments }}
      stack: ${{ steps.classify.outputs.stack }}
      apply: ${{ steps.classify.outputs.apply }}
    steps:
      - id: classify
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_STACK: ${{ github.event.inputs.stack }}
          ACTION: ${{ github.event.inputs.action }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
        run: |
          ENV="$INPUT_ENV"
          if [ -z "$ENV" ] || [ "$ENV" = "auto" ]; then
            if [ "$REF_TYPE" = "tag" ]; then ENV=prod; else ENV=staging; fi
          fi
          case "$ENV" in
            staging | prod) ;;
            *) echo "unknown environment '$ENV'"; exit 1 ;;
          esac
          if [ "$ENV" = "prod" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "prod runs must come from a v* tag — got $REF"
            exit 1
          fi
          STACK="${INPUT_STACK:-both}"
          case "$STACK" in
            both | site | metrics) ;;
            *) echo "unknown stack '$STACK'"; exit 1 ;;
          esac
          APPLY=false
          if [ "$EVENT" = "push" ]; then
            APPLY=true
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$ACTION" = "apply" ]; then
            APPLY=true
          fi
          {
            printf 'environments=["%s"]\n' "$ENV"
            echo "apply=$APPLY"
            echo "stack=$STACK"
          } >> "$GITHUB_OUTPUT"
          echo "resolved environment=$ENV stack=$STACK apply=$APPLY"

  site:
    needs: detect
    if: ${{ needs.detect.outputs.stack != 'metrics' }}
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.detect.outputs.environments) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ matrix.environment }}
    concurrency:
      group: terraform-site-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/infra/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: tfproviders-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            tfproviders-${{ runner.os }}-

      - name: Enable the Terraform plugin cache
        run: echo "TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Assume the terraform role for the target environment (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init (S3 backend — bucket derived from the env; S3-native locking)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.PROJECT }}-${{ matrix.environment }}-tfstate" \
            -backend-config="key=site/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Plan (${{ matrix.environment }})
        run: |
          terraform plan -input=false -no-color -out=tf.plan \
            -var "environment=${{ matrix.environment }}" \
            -var "project=${{ vars.PROJECT }}" \
            -var "aws_region=${{ vars.AWS_REGION }}" \
            -var 'tags={"project":"${{ vars.PROJECT }}","managed_by":"terraform","repo":"${{ github.repository }}"}'

      - name: Apply
        if: ${{ needs.detect.outputs.apply == 'true' }}
        run: terraform apply -input=false -no-color tf.plan

  metrics:
    needs: [detect, site]
    if: ${{ !cancelled() && needs.detect.outputs.stack != 'site' && (needs.site.result == 'success' || needs.site.result == 'skipped') }}
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.detect.outputs.environments) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ matrix.environment }}
    concurrency:
      group: terraform-metrics-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/infra/metrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"

      - name: Cache Terraform providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: tfproviders-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            tfproviders-${{ runner.os }}-

      - name: Enable the Terraform plugin cache
        run: echo "TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Assume the terraform role for the target environment (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init (S3 backend — bucket derived from the env; S3-native locking)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.PROJECT }}-${{ matrix.environment }}-tfstate" \
            -backend-config="key=metrics/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Plan (${{ matrix.environment }})
        run: |
          terraform plan -input=false -no-color -out=tf.plan \
            -var "environment=${{ matrix.environment }}" \
            -var "project=${{ vars.PROJECT }}" \
            -var "aws_region=${{ vars.AWS_REGION }}" \
            -var "allowed_origin=${{ vars.ALLOWED_ORIGIN }}" \
            -var 'tags={"project":"${{ vars.PROJECT }}","managed_by":"terraform","repo":"${{ github.repository }}"}'

      - name: Apply
        if: ${{ needs.detect.outputs.apply == 'true' }}
        run: terraform apply -input=false -no-color tf.plan
