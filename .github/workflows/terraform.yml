name: Terraform

# Plans automatically whenever terraform/ changes (push to main); applies only
# on manual workflow_dispatch with action=apply — a blind auto-apply is how
# stacks get destroyed. Uses OIDC (no secrets): the repo needs the secrets
# AWS_ROLE_ARN + AWS_REGION (see DEVOPS §7.1 / terraform/ci).
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Plan or apply (apply is destructive — review the plan first)"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      # TEMP debug — prints OIDC token claims + secret sanity; remove after diagnosis
      - name: Debug OIDC (temp)
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          TOKEN="$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
          CLAIMS="$(printf '%s' "${TOKEN}" | cut -d. -f2 | python3 -c 'import sys,base64,json; p=sys.stdin.read().strip(); p+="="*(-len(p)%4); print(json.dumps(json.loads(base64.b64decode(p))))')"
          echo "::error::OIDC_CLAIMS=${CLAIMS}"
          echo "::error::ROLE_ARN_LEN=$(python3 -c "import os; print(len(os.environ['ROLE_ARN']))")"
          echo "::error::ROLE_ARN_TAIL=$(python3 -c "import os; print(repr(os.environ['ROLE_ARN'][-25:]))")"
          echo "::error::REGION=$(python3 -c "import os; print(repr(os.environ['REGION']))")"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Assume AWS role (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Init (S3 backend — shared state with local dev)
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan (prod)
        run: |
          # Free-Tier default: WAF + private VPC are OFF (the Logs VPC endpoint
          # and WAF are outside the Free Tier). The Lambda origin gate (403 for
          # non-site origins) + least-privilege IAM are the free security
          # controls. Flip enable_vpc/enable_waf for the hardened variant.
          terraform plan -input=false -no-color -out=tf.plan \
            -var environment=prod \
            -var allowed_origin=https://mathewmusango.github.io \
            -var enable_vpc=false \
            -var enable_waf=false

      - name: Apply (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -input=false -no-color tf.plan
