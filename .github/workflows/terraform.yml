name: Terraform

# Environment is controlled from GitHub by the trigger:
#   push main (terraform/**)  -> staging — plan + AUTO-APPLY
#   push v* tag               -> prod   — plan only (apply stays manual)
#   pull_request (terraform/**) -> staging — plan only, commented on the PR
#   workflow_dispatch         -> choose environment + action
# Prod is NEVER auto-applied — a blind auto-apply is how stacks get destroyed.
# Uses OIDC. Secrets: STAGING/PROD_TERRAFORM_ROLE_ARN, PROJECT, AWS_REGION,
# STAGING/PROD_ALLOWED_ORIGIN (see terraform/ci + scripts/bootstrap-aws.sh).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "terraform/**"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Plan or apply (apply is destructive — review the plan first)"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      environment:
        description: "Target (default: v* tag -> prod, main -> staging)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - staging
          - prod

permissions:
  id-token: write
  contents: read
  pull-requests: write

# One run per environment at a time — a queued run waits for the in-flight
# apply rather than racing it for the state lock (github context only, since
# this resolves before the env step runs).
concurrency:
  group: terraform-${{ github.event.inputs.environment != 'auto' && github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging') }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Resolve environment (dispatch override > v* tag > main)
        id: env
        run: |
          ENV="${{ github.event.inputs.environment != 'auto' && github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging') }}"
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "Resolved environment: $ENV"

      - name: Assume AWS role (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.env.outputs.environment == 'prod' && secrets.PROD_TERRAFORM_ROLE_ARN || secrets.STAGING_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Init (S3 backend — bucket derived from the env; S3-native locking)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.PROJECT }}-${{ steps.env.outputs.environment }}-tfstate" \
            -backend-config="key=metrics/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Validate
        run: terraform validate

      - name: Plan (${{ steps.env.outputs.environment }})
        id: plan
        run: |
          set -o pipefail
          # Free-Tier default: WAF + private VPC are OFF (the Logs VPC endpoint
          # and WAF are outside the Free Tier). The Lambda origin gate (403 for
          # non-site origins) + least-privilege IAM are the free security
          # controls. Geo headers come from CloudFront — BOTH envs get the edge.
          # Flip enable_vpc/enable_waf for the hardened variant.
          terraform plan -input=false -no-color -out=tf.plan \
            -var "environment=${{ steps.env.outputs.environment }}" \
            -var "project=${{ secrets.PROJECT }}" \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "allowed_origin=${{ steps.env.outputs.environment == 'prod' && secrets.PROD_ALLOWED_ORIGIN || secrets.STAGING_ALLOWED_ORIGIN }}" \
            -var 'tags={"project":"${{ secrets.PROJECT }}","managed_by":"terraform","repo":"${{ github.repository }}"}' \
            -var enable_vpc=false \
            -var enable_waf=false \
            -var enable_cloudfront=true \
            -var enable_metrics=true \
            | tee "$GITHUB_WORKSPACE/terraform-plan.txt"

      - name: Comment plan on PR (staging)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          # Read the plan from the file (not the step output) so plan content
          # can't inject expressions; update the bot's previous comment.
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(
              `${process.env.GITHUB_WORKSPACE}/terraform-plan.txt`, 'utf8'
            ).slice(0, 60000);
            const marker = '<!-- terraform-plan -->';
            const body = `${marker}\n#### Terraform plan (staging)\n\`\`\`diff\n${plan}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Apply (staging auto on main; prod only via manual dispatch)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -input=false -no-color tf.plan
