name: "Infra: Terraform"

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Plan or apply (apply is destructive — review the plan first)"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      environment:
        description: "Target (default: v* tag -> prod, main -> staging)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - staging
          - prod

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.classify.outputs.environment }}
      apply: ${{ steps.classify.outputs.apply }}
    steps:
      - id: classify
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          ACTION: ${{ github.event.inputs.action }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
        run: |
          ENV="$INPUT_ENV"
          if [ -z "$ENV" ] || [ "$ENV" = "auto" ]; then
            if [ "$REF_TYPE" = "tag" ]; then ENV=prod; else ENV=staging; fi
          fi
          case "$ENV" in
            staging | prod) ;;
            *) echo "unknown environment '$ENV'"; exit 1 ;;
          esac
          if [ "$ENV" = "prod" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "prod runs must come from a v* tag — got $REF"
            exit 1
          fi
          APPLY=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$ACTION" = "apply" ]; then
            APPLY=true
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            APPLY=true
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          echo "resolved environment=$ENV apply=$APPLY"

  terraform:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ needs.detect.outputs.environment }}
    concurrency:
      group: terraform-${{ needs.detect.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: ${{ needs.detect.outputs.environment }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"

      - name: Assume the terraform role for the target environment (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init (S3 backend — bucket derived from the env; S3-native locking)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.PROJECT }}-$TARGET_ENV-tfstate" \
            -backend-config="key=metrics/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Plan (${{ env.TARGET_ENV }})
        run: |
          terraform plan -input=false -no-color -out=tf.plan \
            -var "environment=$TARGET_ENV" \
            -var "project=${{ vars.PROJECT }}" \
            -var "aws_region=${{ vars.AWS_REGION }}" \
            -var "allowed_origin=${{ vars.ALLOWED_ORIGIN }}" \
            -var 'tags={"project":"${{ vars.PROJECT }}","managed_by":"terraform","repo":"${{ github.repository }}"}' \
            -var enable_vpc=false \
            -var enable_waf=false \
            -var enable_cloudfront=true \
            -var enable_metrics=true

      - name: Apply (staging auto on main; prod only via manual dispatch)
        if: ${{ needs.detect.outputs.apply == 'true' }}
        run: terraform apply -input=false -no-color tf.plan
