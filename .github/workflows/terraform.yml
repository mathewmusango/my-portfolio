name: Terraform

# Plans automatically whenever terraform/ changes (push to main); applies only
# on manual workflow_dispatch with action=apply — a blind auto-apply is how
# stacks get destroyed. Uses OIDC: the repo needs the secrets
# PROD_AWS_ROLE_ARN + AWS_REGION + PROJECT + TF_ENVIRONMENT + ALLOWED_ORIGIN
# (see terraform/ci + scripts/bootstrap-aws.sh).
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Plan or apply (apply is destructive — review the plan first)"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Assume AWS role (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Init (S3 backend — bucket/lock derived from PROJECT + TF_ENVIRONMENT secrets)
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.PROJECT }}-${{ secrets.TF_ENVIRONMENT }}-tfstate" \
            -backend-config="key=metrics/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.PROJECT }}-${{ secrets.TF_ENVIRONMENT }}-tfstate-lock" \
            -backend-config="encrypt=true"

      - name: Validate
        run: terraform validate

      - name: Plan (prod)
        run: |
          # Free-Tier default: WAF + private VPC are OFF (the Logs VPC endpoint
          # and WAF are outside the Free Tier). The Lambda origin gate (403 for
          # non-site origins) + least-privilege IAM are the free security
          # controls. CloudFront is ON (geo headers + HTTPS edge). Flip
          # enable_vpc/enable_waf for the hardened variant.
          terraform plan -input=false -no-color -out=tf.plan \
            -var "environment=${{ secrets.TF_ENVIRONMENT }}" \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "allowed_origin=${{ secrets.ALLOWED_ORIGIN }}" \
            -var enable_vpc=false \
            -var enable_waf=false \
            -var enable_cloudfront=true

      - name: Apply (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -input=false -no-color tf.plan
