name: Terraform checks

# STATIC checks only (fmt / validate / tflint / checkov) — no AWS credentials
# involved, runs on main pushes + v* tags + manual dispatch. This is NOT the
# deploy pipeline: terraform.yml plans/applies the real stack (staging
# auto-apply on main, prod plan-only on v* tags).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "terraform/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform-checks.yml"
  workflow_dispatch: {}

env:
  TF_VERSION: "1.15.9"

permissions:
  contents: read

jobs:

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff terraform/

  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        dir: ["terraform", "terraform/ci", "terraform/modules/metrics"]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init (no backend)
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color

  lint:
    name: tflint
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: Init TFLint plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run TFLint
        run: tflint --recursive --format compact

  security:
    name: security (checkov)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v7
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          # Informational initially — findings overlap the audit backlog
          # (iam:PassRole *, site bucket versioning, ...). Flip to false once
          # the backlog items land.
          soft_fail: true
