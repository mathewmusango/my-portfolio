name: Deploy

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]

jobs:
  detect:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      staging: ${{ steps.classify.outputs.staging }}
      prod: ${{ steps.classify.outputs.prod }}
    steps:
      - id: classify
        env:
          HEAD: ${{ github.event.workflow_run.head_branch }}
          TRIGGER: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          staging=false
          prod=false
          if [ "$TRIGGER" = "push" ]; then
            if [ "$HEAD" = "main" ]; then
              staging=true
            elif gh api --silent "repos/$REPO/git/ref/tags/$HEAD" 2>/dev/null; then
              prod=true
            fi
          fi
          if [ "$TRIGGER" = "workflow_dispatch" ] && [ "$HEAD" = "main" ]; then
            staging=true
          fi
          if [ "$staging" = "true" ] || [ "$prod" = "true" ]; then
            if gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.expired == false) | .name' >/tmp/artifacts.txt 2>/dev/null; then
              if ! grep -qx site /tmp/artifacts.txt; then
                echo "build run $RUN_ID produced no site artifact — nothing to deploy"
                staging=false
                prod=false
              fi
            fi
          fi
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          echo "prod=$prod" >> "$GITHUB_OUTPUT"
          echo "build on '$HEAD' ($TRIGGER) concluded '$CONCLUSION' -> staging=$staging prod=$prod"

  aws-s3-staging:
    name: aws-s3 / staging
    needs: detect
    if: ${{ needs.detect.outputs.staging == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    concurrency:
      group: deploy-staging-aws-s3
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/aws-s3
        with:
          project: ${{ vars.PROJECT }}
          env: staging
          run_id: ${{ github.event.workflow_run.id }}
          site_url: ${{ vars.SITE_URL }}
          metrics_endpoint: ${{ vars.METRICS_ENDPOINT }}
          deploy_role_arn: ${{ secrets.DEPLOY_ROLE_ARN }}
          invalidate_role_arn: ${{ secrets.INVALIDATE_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}
          hash_skip: "true"

  aws-s3-prod:
    name: aws-s3 / prod
    needs: detect
    if: ${{ needs.detect.outputs.prod == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
    concurrency:
      group: deploy-prod-aws-s3
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/aws-s3
        with:
          project: ${{ vars.PROJECT }}
          env: prod
          run_id: ${{ github.event.workflow_run.id }}
          site_url: ${{ vars.SITE_URL }}
          metrics_endpoint: ${{ vars.METRICS_ENDPOINT }}
          deploy_role_arn: ${{ secrets.DEPLOY_ROLE_ARN }}
          invalidate_role_arn: ${{ secrets.INVALIDATE_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}
          hash_skip: "false"

  github-pages-prod:
    name: github-pages / prod
    needs: detect
    if: ${{ needs.detect.outputs.prod == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site
          path: site
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Substitute this environment's URLs
        uses: ./.github/actions/inject-env-urls
        with:
          site_url: ${{ vars.SITE_URL }}
          metrics_endpoint: ${{ vars.METRICS_ENDPOINT }}
          directory: site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
