name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: ./.github/actions/build-site
        with:
          site_url: https://mathewmusango.github.io/my-portfolio/
          # The metrics endpoint is baked into the artifact at build time, so the
          # trigger picks the right one: tags -> prod, main -> staging.
          metrics_endpoint: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PROD_METRICS_ENDPOINT || secrets.STAGING_METRICS_ENDPOINT }}

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          retention-days: 7
          if-no-files-found: error
