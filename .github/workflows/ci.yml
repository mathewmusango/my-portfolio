name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: ./.github/actions/build-site
        with:
          # site_url + metrics endpoint are baked into the artifact at build
          # time, so the trigger picks the right ones: tags -> prod, main ->
          # staging (secrets: STAGING/PROD_SITE_URL, STAGING/PROD_METRICS_ENDPOINT).
          site_url: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PROD_SITE_URL || secrets.STAGING_SITE_URL }}
          metrics_endpoint: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.PROD_METRICS_ENDPOINT || secrets.STAGING_METRICS_ENDPOINT }}

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site
          path: site/
          retention-days: 7
          if-no-files-found: error
