name: checks

# Checks come from the shared workflow library (mathewmusango/myprojects),
# pinned to the v3 tag. The library owns the definitions; this repo owns the
# trigger.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  js:
    uses: mathewmusango/myprojects/.github/workflows/checks-js.yml@v3
  python:
    uses: mathewmusango/myprojects/.github/workflows/checks-python.yml@v3
  shell:
    uses: mathewmusango/myprojects/.github/workflows/checks-shell.yml@v3
  terraform:
    uses: mathewmusango/myprojects/.github/workflows/checks-terraform.yml@v3
  yaml:
    uses: mathewmusango/myprojects/.github/workflows/checks-yaml.yml@v3
  secrets:
    uses: mathewmusango/myprojects/.github/workflows/security-secrets.yml@v3
  deps:
    uses: mathewmusango/myprojects/.github/workflows/security-deps.yml@v3
