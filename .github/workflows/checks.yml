name: checks

# Checks come from the shared workflow library (mathewmusango/myprojects),
# pinned to a commit SHA. The library owns the definitions; this repo owns the
# trigger.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  js:
    uses: mathewmusango/myprojects/.github/workflows/checks-js.yml@1d646f3dec2358941feb54a2b71a6c7eb66d7519
  python:
    uses: mathewmusango/myprojects/.github/workflows/checks-python.yml@1d646f3dec2358941feb54a2b71a6c7eb66d7519
  shell:
    uses: mathewmusango/myprojects/.github/workflows/checks-shell.yml@1d646f3dec2358941feb54a2b71a6c7eb66d7519
  terraform:
    uses: mathewmusango/myprojects/.github/workflows/checks-terraform.yml@1d646f3dec2358941feb54a2b71a6c7eb66d7519
  yaml:
    uses: mathewmusango/myprojects/.github/workflows/checks-yaml.yml@1d646f3dec2358941feb54a2b71a6c7eb66d7519
  secrets:
    uses: mathewmusango/myprojects/.github/workflows/security-secrets.yml@1d646f3dec2358941feb54a2b71a6c7eb66d7519
  deps:
    uses: mathewmusango/myprojects/.github/workflows/security-deps.yml@1d646f3dec2358941feb54a2b71a6c7eb66d7519
