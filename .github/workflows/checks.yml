name: checks

# Checks come from the shared workflow library (mathewmusango/my-workflows),
# pinned to a commit SHA. The library owns the definitions; this repo owns the
# trigger.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  js:
    uses: mathewmusango/my-workflows/.github/workflows/checks-js.yml@b5d076b992526405c469346ae33dced92e162504
  python:
    uses: mathewmusango/my-workflows/.github/workflows/checks-python.yml@b5d076b992526405c469346ae33dced92e162504
  shell:
    uses: mathewmusango/my-workflows/.github/workflows/checks-shell.yml@b5d076b992526405c469346ae33dced92e162504
  terraform:
    uses: mathewmusango/my-workflows/.github/workflows/checks-terraform.yml@b5d076b992526405c469346ae33dced92e162504
  yaml:
    uses: mathewmusango/my-workflows/.github/workflows/checks-yaml.yml@b5d076b992526405c469346ae33dced92e162504
  secrets:
    uses: mathewmusango/my-workflows/.github/workflows/security-secrets.yml@b5d076b992526405c469346ae33dced92e162504
  deps:
    uses: mathewmusango/my-workflows/.github/workflows/security-deps.yml@b5d076b992526405c469346ae33dced92e162504
