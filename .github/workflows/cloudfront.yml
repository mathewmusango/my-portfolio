name: "Infra: CloudFront"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "What to do"
        required: true
        default: "invalidate"
        type: choice
        options:
          - invalidate
          - switch
      environment:
        description: "Target environment (prod requires a v* tag ref)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
      paths:
        description: "invalidate only — space-separated paths (default /*)"
        required: false
        default: "/*"
      component:
        description: "switch only — what to flip"
        required: false
        default: "site"
        type: choice
        options:
          - site
          - metrics
      mode:
        description: "switch only — attribute flip, nothing is removed"
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - "on"

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.check.outputs.environment }}
    steps:
      - id: check
        env:
          TARGET: ${{ github.event.inputs.environment }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
        run: |
          case "$TARGET" in
            staging | prod) ;;
            *) echo "unknown environment '$TARGET'"; exit 1 ;;
          esac
          if [ "$TARGET" = "prod" ] && [ "$REF_TYPE" != "tag" ]; then
            echo "prod runs must be dispatched on a v* tag — got $REF"
            exit 1
          fi
          echo "environment=$TARGET" >> "$GITHUB_OUTPUT"
          echo "target environment=$TARGET (ref $REF)"

  invalidate:
    needs: detect
    if: ${{ github.event.inputs.operation == 'invalidate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ needs.detect.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume the invalidate role for the target environment (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.INVALIDATE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Invalidate the distribution (lookup by comment convention)
        env:
          PROJECT: ${{ vars.PROJECT }}
          TARGET_ENV: ${{ needs.detect.outputs.environment }}
          PATHS: ${{ github.event.inputs.paths }}
        run: |
          ID="$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='$PROJECT-$TARGET_ENV-site'].Id" --output text)"
          if [ -z "$ID" ]; then
            echo "distribution '$PROJECT-$TARGET_ENV-site' not found — skipping invalidation (content synced)"
            exit 0
          fi
          echo "Invalidating CloudFront '$PROJECT-$TARGET_ENV-site' ($ID): $PATHS"
          aws cloudfront create-invalidation --distribution-id "$ID" --paths "$PATHS"

  switch:
    needs: detect
    if: ${{ github.event.inputs.operation == 'switch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ needs.detect.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume the toggle role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.TOGGLE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Flip Enabled on the distribution
        env:
          PROJECT: ${{ vars.PROJECT }}
          TARGET_ENV: ${{ needs.detect.outputs.environment }}
          COMPONENT: ${{ github.event.inputs.component }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          COMMENT="$PROJECT-$TARGET_ENV-$COMPONENT"
          if [ "$MODE" = "on" ]; then
            ENABLED=true
          else
            ENABLED=false
          fi
          ID="$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='$COMMENT'].Id" --output text)"
          if [ -z "$ID" ]; then
            echo "distribution not found for comment '$COMMENT' — nothing to switch"
            exit 0
          fi
          ETAG="$(aws cloudfront get-distribution --id "$ID" --query ETag --output text)"
          aws cloudfront get-distribution --id "$ID" --query Distribution.DistributionConfig > /tmp/cf-switch-config.json
          jq --argjson enabled "$ENABLED" '.Enabled = $enabled' /tmp/cf-switch-config.json > /tmp/cf-switch-config-new.json
          aws cloudfront update-distribution --id "$ID" --if-match "$ETAG" --distribution-config file:///tmp/cf-switch-config-new.json
          echo "cloudfront $COMMENT -> $MODE (distribution $ID)"
