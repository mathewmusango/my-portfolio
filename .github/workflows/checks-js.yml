name: Checks JS

# node --check syntax validation of the site's JavaScript — runs once on main
# (or dispatch) when docs/javascripts/** or overrides/**/*.js change. (Not
# triggered by this file's own change — workflow files are linted by checks-yml.)
on:
  push:
    branches: [main]
    paths:
      - "docs/javascripts/**"
      - "overrides/**/*.js"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: node --check (syntax)
        run: |
          find docs/javascripts overrides -type f -name '*.js' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            node --check "$f"
            echo "ok: $f"
          done
