name: Checks JS

# node --check syntax validation of every JS file in the repo (project +
# vendored) — runs once on main (or dispatch) when any .js changes, anywhere.
# Extension-wide so NEW js files in new locations are never missed.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.js"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  node-check:
    name: Checks JS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: node --check (syntax)
        run: |
          find . -path './site' -prune -o -path './.git' -prune -o -type f -name '*.js' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            node --check "$f"
            echo "ok: $f"
          done
