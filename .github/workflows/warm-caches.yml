name: "Cache: Warm"

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".tflint.hcl"
      - ".github/workflows/warm-caches.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.terraform.d/plugin-cache
          key: tfproviders-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            tfproviders-${{ runner.os }}-

      - name: Enable the Terraform plugin cache
        run: echo "TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Seed the provider cache
        run: |
          dirs="$(find . -path './.git' -prune -o -type f -name '*.tf' -print0 2>/dev/null | xargs -0 -r -n1 dirname | sort -u)"
          if [ -z "$dirs" ]; then
            echo "no terraform modules found"
            exit 0
          fi
          while IFS= read -r d; do
            echo "::group::terraform init $d"
            (cd "$d" && terraform init -backend=false -input=false >/dev/null)
            echo "::endgroup::"
          done <<< "$dirs"

  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          tflint_version: latest

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}
          restore-keys: |
            tflint-${{ runner.os }}-

      - name: Seed the tflint plugin cache
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
