name: Checks Shell

# Shellcheck on the repo's shell scripts — runs once on main (or dispatch)
# when scripts/*.sh changes. (Not triggered by this file's own change — the
# workflow files themselves are linted by checks-yml.)
on:
  push:
    branches: [main]
    paths:
      - "scripts/*.sh"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        # ubuntu-latest runners ship shellcheck; the koalaman/shellcheck-action
        # repo no longer resolves on GitHub ("repository not found").
        run: shellcheck -S warning scripts/*.sh
