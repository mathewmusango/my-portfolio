name: Checks Shell

# Shellcheck on every shell script in the repo (scripts/*.sh + .githooks/*) —
# runs once on main (or dispatch) when any .sh changes, anywhere. Extension-wide
# so NEW shell scripts in new locations are never missed.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.sh"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        # ubuntu-latest runners ship shellcheck; the koalaman/shellcheck-action
        # repo no longer resolves on GitHub ("repository not found").
        run: |
          find . -path './site' -prune -o -path './.git' -prune -o -type f \( -name '*.sh' -o -path './.githooks/*' \) -print0 2>/dev/null | xargs -0 -r shellcheck -S warning
