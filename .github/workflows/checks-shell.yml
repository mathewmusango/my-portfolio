name: Checks Shell

# Shellcheck on the repo's shell scripts — runs once on main (or dispatch)
# when scripts/*.sh (or this file) changes.
on:
  push:
    branches: [main]
    paths:
      - "scripts/*.sh"
      - ".github/workflows/checks-shell.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        uses: koalaman/shellcheck-action@v1.0.0
        with:
          severity: warning
