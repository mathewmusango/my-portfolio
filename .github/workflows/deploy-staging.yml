name: Deploy staging

# Deploys the built site to the STAGING S3 bucket on main-push CI success.
# gh-pages and prod S3 are tag-only (deploy-prod.yml) — never from main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  id-token: write
  actions: read
  contents: read

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check site changes (deploy only when docs/ overrides/ mkdocs.yml changed)
        id: docs
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null 2>&1 && ! git diff --name-only HEAD~1 HEAD -- docs/ overrides/ mkdocs.yml | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync site to staging S3 (bucket root — site serves at /)
        if: steps.docs.outputs.changed == 'true'
        run: aws s3 sync site/ "s3://${{ secrets.PROJECT }}-staging-site/" --delete --no-progress

      - name: Invalidate staging CloudFront (lookup by comment convention)
        if: steps.docs.outputs.changed == 'true'
        run: |
          ID="$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='${{ secrets.PROJECT }}-staging-site'].Id" --output text)"
          if [ -n "$ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$ID" --paths "/*"
          else
            echo "distribution not found yet — skipping invalidation (content synced)"
          fi
