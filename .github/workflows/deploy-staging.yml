name: "Deploy: staging"

on:
  workflow_call:
    secrets:
      PROJECT:
        required: true
      AWS_REGION:
        required: true
      DEPLOY_ROLE_ARN:
        required: true
      INVALIDATE_ROLE_ARN:
        required: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      deploy: ${{ steps.classify.outputs.deploy }}
    steps:
      - id: classify
        env:
          HEAD: ${{ github.event.workflow_run.head_branch }}
          TRIGGER: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          deploy=false
          if [ "$CONCLUSION" = "success" ] && [ "$TRIGGER" = "push" ] && [ "$HEAD" = "main" ]; then
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "ci on '$HEAD' ($TRIGGER) concluded '$CONCLUSION' -> staging deploy=$deploy"

  aws-s3:
    needs: detect
    if: ${{ needs.detect.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    concurrency:
      group: deploy-staging-aws-s3
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/aws-s3
        with:
          project: ${{ secrets.PROJECT }}
          env: staging
          run_id: ${{ github.event.workflow_run.id }}
          deploy_role_arn: ${{ secrets.DEPLOY_ROLE_ARN }}
          invalidate_role_arn: ${{ secrets.INVALIDATE_ROLE_ARN }}
          aws_region: ${{ secrets.AWS_REGION }}
          hash_skip: "true"
