name: Deploy prod s3

# Tag-only (v*): syncs the CI-built site to the prod S3 bucket + CloudFront.
# Never runs on main — staging deploys via deploy-staging.yml, the GitHub Pages
# copy via deploy-prod-pages.yml. Always deploys when CI succeeds on a v* tag:
# the artifact is built by CI with the per-environment site_url/metrics_endpoint,
# so a successful CI run always has a fresh site to sync.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  id-token: write
  actions: read
  contents: read

jobs:
  deploy-s3:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync site to prod S3 (bucket root — site serves at /)
        run: aws s3 sync site/ "s3://${{ secrets.PROJECT }}-prod-site/" --delete --no-progress

      - name: Assume edge-invalidate role (least privilege)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_INVALIDATE_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Invalidate prod CloudFront (lookup by comment convention)
        run: |
          ID="$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='${{ secrets.PROJECT }}-prod-site'].Id" --output text)"
          if [ -n "$ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$ID" --paths "/*"
          else
            echo "distribution not found yet — skipping invalidation (content synced)"
          fi
