name: "Infra: Toggle Env"

# DISABLE / ENABLE the STAGING CloudFront distributions WITHOUT removing
# anything — the invalidation-style toggle (scripts/toggle_cloudfront.sh):
# look up the distro by comment convention (<project>-staging-<component>)
# and flip Enabled in place. No terraform apply runs here — nothing can be
# deleted.
#   component:   site | metrics
#   action:      disable | enable
# STAGING ONLY by design (user decision 2026-08-29): prod has no toggle role —
# an accidental disable on the prod metrics edge would stop collection.
# DRIFT CAVEAT: Enabled lives outside terraform state — the next staging
# terraform apply restores it to true; re-dispatch to disable again.
# Uses OIDC. Secrets: STAGING_TOGGLE_ROLE_ARN, PROJECT, AWS_REGION.
on:
  workflow_dispatch:
    inputs:
      component:
        description: "What to toggle"
        required: true
        default: "site"
        type: choice
        options:
          - site
          - metrics
      action:
        description: "disable or enable (attribute flip only — nothing is removed)"
        required: true
        default: "disable"
        type: choice
        options:
          - disable
          - enable

permissions:
  id-token: write
  contents: read

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.STAGING_TOGGLE_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Toggle CloudFront (staging ${{ github.event.inputs.component }} -> ${{ github.event.inputs.action }})
        env:
          PROJECT: ${{ secrets.PROJECT }}
        run: scripts/toggle_cloudfront.sh staging ${{ github.event.inputs.component }} ${{ github.event.inputs.action }}
