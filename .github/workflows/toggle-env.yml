name: Toggle env

# DISABLE / ENABLE a CloudFront distribution WITHOUT removing anything — the
# invalidation-style toggle (scripts/toggle-cloudfront.sh): look up the distro
# by comment convention (<project>-<env>-<component>) and flip Enabled in
# place. No terraform apply runs here — nothing can be deleted.
#   environment: staging | prod
#   component:   site | metrics
#   action:      disable | enable
# DRIFT CAVEAT: Enabled lives outside terraform state — the next terraform
# apply (staging on main pushes, prod on tag applies) restores it to true;
# re-dispatch to disable again.
# Uses OIDC. Secrets: STAGING/PROD_DEPLOY_ROLE_ARN, PROJECT, AWS_REGION.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
      component:
        description: "What to toggle"
        required: true
        default: "site"
        type: choice
        options:
          - site
          - metrics
      action:
        description: "disable or enable (attribute flip only — nothing is removed)"
        required: true
        default: "disable"
        type: choice
        options:
          - disable
          - enable

permissions:
  id-token: write
  contents: read

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_TOGGLE_ROLE_ARN || secrets.STAGING_TOGGLE_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Toggle CloudFront (${{ github.event.inputs.environment }} ${{ github.event.inputs.component }} -> ${{ github.event.inputs.action }})
        env:
          PROJECT: ${{ secrets.PROJECT }}
        run: scripts/toggle-cloudfront.sh ${{ github.event.inputs.environment }} ${{ github.event.inputs.component }} ${{ github.event.inputs.action }}
