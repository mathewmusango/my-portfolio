name: Deploy prod

# Tag-only (v*): publishes the site to gh-pages (prod public) AND the prod S3
# bucket + CloudFront. Never runs on main — staging deploys via deploy-staging.yml.
# A changes job gates both deploy jobs: when the tagged commit didn't change
# the site (docs/ overrides/ mkdocs.yml), they report SKIPPED.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  id-token: write
  actions: read
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v') }}
    outputs:
      changed: ${{ steps.docs.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Check site changes (deploy only when docs/ overrides/ mkdocs.yml changed)
        id: docs
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null 2>&1 && ! git diff --name-only HEAD~1 HEAD -- docs/ overrides/ mkdocs.yml | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -b gh-pages
          git config user.name "mathewmusango"
          git config user.email "mathewmusango@gmail.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA:0:7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:gh-pages"

  deploy-s3:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync site to prod S3 (bucket root — site serves at /)
        run: aws s3 sync site/ "s3://${{ secrets.PROJECT }}-prod-site/" --delete --no-progress

      - name: Invalidate prod CloudFront (lookup by comment convention)
        run: |
          ID="$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='${{ secrets.PROJECT }}-prod-site'].Id" --output text)"
          if [ -n "$ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$ID" --paths "/*"
          else
            echo "distribution not found yet — skipping invalidation (content synced)"
          fi
