name: "Deploy: prod"

on:
  workflow_call:
    secrets:
      PROJECT:
        required: true
      AWS_REGION:
        required: true
      DEPLOY_ROLE_ARN:
        required: true
      INVALIDATE_ROLE_ARN:
        required: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.classify.outputs.deploy }}
    steps:
      - id: classify
        env:
          HEAD: ${{ github.event.workflow_run.head_branch }}
          TRIGGER: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy=false
          if [ "$CONCLUSION" = "success" ] && [ "$TRIGGER" = "push" ]; then
            if gh api --silent "repos/$REPO/git/ref/tags/$HEAD" 2>/dev/null; then
              deploy=true
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "ci on '$HEAD' ($TRIGGER) concluded '$CONCLUSION' -> prod deploy=$deploy"

  aws-s3:
    needs: detect
    if: ${{ needs.detect.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
    concurrency:
      group: deploy-prod-aws-s3
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/aws-s3
        with:
          project: ${{ secrets.PROJECT }}
          env: prod
          run_id: ${{ github.event.workflow_run.id }}
          deploy_role_arn: ${{ secrets.DEPLOY_ROLE_ARN }}
          invalidate_role_arn: ${{ secrets.INVALIDATE_ROLE_ARN }}
          aws_region: ${{ secrets.AWS_REGION }}
          hash_skip: "false"

  github-pages:
    needs: detect
    if: ${{ needs.detect.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site
          path: site
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
