name: "Deploy: GitHub Pages"
description: >-
  Publish the CI-built site to GitHub Pages with the official Pages actions
  (configure → upload → deploy). Least privilege by construction: the action
  never touches AWS, and the caller's job is the only place `pages: write` is
  granted.

inputs:
  run_id:
    description: The ci run that produced the `site` artifact.
    required: true

outputs:
  page_url:
    description: The deployed Pages URL, for the caller's environment url.
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: Download site artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: site
        path: site
        github-token: ${{ github.token }}
        run-id: ${{ inputs.run_id }}

    - name: Configure Pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
      with:
        path: site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
