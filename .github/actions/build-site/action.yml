name: Build site
description: Install dependencies, build strict, and run the site checks (pip-audit, links, CSS).

inputs:
  site_url:
    description: Site URL to inject before building. Required — must be an https:// URL.
    required: true
  metrics_endpoint:
    description: METRICS_ENDPOINT for the beacon (CloudFront/API URL). Empty disables the beacon; when set it must be an https:// URL.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate build inputs
      shell: bash
      env:
        SITE_URL: ${{ inputs.site_url }}
        METRICS: ${{ inputs.metrics_endpoint }}
      run: |
        ok=1
        case "$SITE_URL" in
          https://*) ;;
          *) echo "::error::site_url must be a non-empty https:// URL (got '${SITE_URL:-<empty>}')"; ok=0 ;;
        esac
        if [ -n "$METRICS" ]; then
          case "$METRICS" in
            https://*) ;;
            *) echo "::error::metrics_endpoint must be an https:// URL when set (got '$METRICS')"; ok=0 ;;
          esac
        fi
        [ "$ok" = 1 ] || exit 1
        echo "build inputs: site_url=$SITE_URL metrics_endpoint=${METRICS:-<unset, beacon disabled>}"

    - name: Inject site_url
      shell: bash
      run: |
        if grep -q '^site_url:' mkdocs.yml; then
          sed -i "s|^site_url:.*|site_url: ${{ inputs.site_url }}|" mkdocs.yml
        else
          printf 'site_url: %s\n' "${{ inputs.site_url }}" >> mkdocs.yml
        fi

    - name: Cache pip
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/pip
        key: "pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}"
        restore-keys: |
          pip-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Build site (strict)
      shell: bash
      env:
        MKDOCS_GIT_COMMITTERS_APIKEY: "${{ github.token }}"
        METRICS_ENDPOINT: "${{ inputs.metrics_endpoint }}"
      run: mkdocs build --strict

    - name: Audit dependencies (pip-audit)
      shell: bash
      run: |
        pip install pip-audit==2.10.1
        pip-audit -r requirements.txt

    - name: Check links
      shell: bash
      run: python3 scripts/checks/links.py site/

    - name: Check translations
      shell: bash
      run: python3 scripts/checks/translations.py

    - name: CSS sanity check
      shell: bash
      run: python3 -c "css=open('docs/stylesheets/extra.css').read(); assert css.count('{') == css.count('}')"
