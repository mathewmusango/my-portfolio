name: Build site
description: Install dependencies, build strict, and run the site checks (pip-audit, links, CSS).

inputs:
  site_url:
    description: Production site URL to inject before building (optional).
    required: false
    default: ""
  metrics_endpoint:
    description: METRICS_ENDPOINT for the beacon (CloudFront/API URL). Empty = beacon disabled.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Inject site_url
      if: inputs.site_url != ''
      shell: bash
      run: |
        # Override the canonical site_url per environment — the artifact is
        # deployed per-env (main -> staging, tags -> prod), so the baked
        # canonical/OG/sitemap URLs must match. mkdocs.yml's value stays the
        # local/prod default for builds that don't pass the input.
        if grep -q '^site_url:' mkdocs.yml; then
          sed -i "s|^site_url:.*|site_url: ${{ inputs.site_url }}|" mkdocs.yml
        else
          printf 'site_url: %s\n' "${{ inputs.site_url }}" >> mkdocs.yml
        fi

    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: "pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}"
        restore-keys: |
          pip-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Build site (strict)
      shell: bash
      env:
        MKDOCS_GIT_COMMITTERS_APIKEY: "${{ github.token }}"
        METRICS_ENDPOINT: "${{ inputs.metrics_endpoint }}"
      run: mkdocs build --strict

    - name: Audit dependencies (pip-audit)
      shell: bash
      run: |
        pip install pip-audit==2.10.1
        pip-audit -r requirements.txt

    - name: Check links
      shell: bash
      run: python3 scripts/check_links.py site/

    - name: Check translations
      shell: bash
      run: python3 scripts/check_translations.py

    - name: CSS sanity check
      shell: bash
      run: python3 -c "css=open('docs/stylesheets/extra.css').read(); assert css.count('{') == css.count('}')"
