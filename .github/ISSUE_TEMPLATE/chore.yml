name: Chore / CI task
description: Tooling, CI/CD, refactors, docs — anything that doesn't change user-facing site content
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear and concise description of the problem or gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternatives you've thought of.
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Which surface does this touch? Drives the label — the issue and its PR carry matching labels.
      options:
        - CI / tooling
        - Infra — Terraform / AWS
        - Security
        - Governance — process / rules / templates
        - Docs
        - Dependencies
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: How does this touch the site or repo?
      options:
        - label: Page/content change (one page, with es/zh if content)
        - label: Global file (extra.css / main.html / mkdocs.yml / javascripts)
        - label: Infra / tooling (workflows, terraform, scripts)
        - label: Repo-level — docs / governance / process (no site or infra touch)
