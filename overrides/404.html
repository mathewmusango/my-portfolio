{# Custom 404 page — platform-themed, rendered directly (static template). #}
{% extends "main.html" %}

{% block content %}
<div class="error-404">
  <svg class="error-404__art" viewBox="0 0 320 240" width="320" height="240" fill="none"
       xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="Platform with one disconnected resource">
    <defs>
      <linearGradient id="g-core" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#26a69a"/>
        <stop offset="1" stop-color="#00897b"/>
      </linearGradient>
    </defs>
    <style>
      .ln  { stroke: #00897b; stroke-width: 2; }
      .lnf { fill: #e6f7f5; stroke: #00897b; stroke-width: 2; }
      .core { fill: url(#g-core); }
      .txt  { font: 600 12px Muli, Arial, sans-serif; fill: #ffffff; }
      .txtd { font: 600 12px Muli, Arial, sans-serif; fill: #37474f; }
      .ghost { stroke: #dc3545; stroke-width: 2; stroke-dasharray: 6 4; fill: #fff5f5; }
      .gq { font: 700 16px Muli, Arial, sans-serif; fill: #dc3545; }
      .broken { stroke: #26a69a; stroke-width: 2; stroke-dasharray: 3 6; stroke-linecap: round; }
    </style>

    <!-- cloud -->
    <g class="lnf">
      <circle cx="95" cy="48" r="16"/>
      <circle cx="122" cy="38" r="20"/>
      <circle cx="150" cy="48" r="15"/>
      <path d="M78 64h90a12 12 0 0 0 0-24 22 22 0 0 0-5-44 30 30 0 0 0-54 8 24 24 0 0 0-39 26 14 14 0 0 0 8 34Z"/>
    </g>

    <!-- platform core (gradient) -->
    <rect x="100" y="118" width="120" height="42" rx="10" class="core"/>
    <text x="160" y="144" text-anchor="middle" class="txt">Platform Core</text>

    <!-- connected nodes -->
    <rect x="16" y="196" width="84" height="34" rx="8" class="lnf"/>
    <text x="58" y="217" text-anchor="middle" class="txtd">Automation</text>
    <rect x="118" y="196" width="84" height="34" rx="8" class="lnf"/>
    <text x="160" y="217" text-anchor="middle" class="txtd">Security</text>
    <rect x="220" y="196" width="84" height="34" rx="8" class="lnf"/>
    <text x="262" y="217" text-anchor="middle" class="txtd">Observability</text>

    <!-- connectors -->
    <path d="M130 66v44" class="ln"/>
    <path d="M160 160v28" class="ln"/>
    <path d="M116 160 64 190" class="ln"/>
    <path d="M204 160l52 30" class="ln"/>

    <!-- broken connection to the missing resource -->
    <path d="M224 130 C 246 112, 262 94, 282 72" class="broken"/>

    <!-- missing resource (ghost, floating) -->
    <g class="error-404__missing">
      <g transform="rotate(8 281 43)">
        <rect x="254" y="24" width="54" height="38" rx="8" class="ghost"/>
        <text x="281" y="49" text-anchor="middle" class="gq">?</text>
      </g>
    </g>
  </svg>

  <h1>404 — Resource Not Found</h1>
  <p>The page you're looking for doesn't exist. Everything else is operating normally.</p>
  <p>
    <a href="{{ base_url }}" class="md-button md-button--primary">Home</a>
    <a href="mailto:musangomathew@gmail.com" class="md-button">Contact Me</a>
  </p>
</div>
{% endblock %}
